---
name: CI

'on':
  push:
  pull_request:

env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'

jobs:
  rust:
    name: Rust API and refinement
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      # dtolnay/rust-toolchain stable action, resolved 2026-09-02
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy, rustfmt
      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-targets: false
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets --all-features
      - run: cargo check --locked --lib --no-default-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo test --locked --doc --all-features
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: python3 scripts/check-refinement.py
      - run: python3 scripts/check-release-ref.py --self-test
      - run: cargo package --locked

  msrv:
    name: Rust 1.85 feature matrix
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      # dtolnay/rust-toolchain 1.85.0 action
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315
      - run: cargo check --locked --lib --no-default-features
      - run: cargo check --locked --lib

  proofs:
    name: Axiom-free Rocq refinement
    runs-on: ubuntu-24.04
    container:
      # yamllint disable-line rule:line-length
      image: rocq/rocq-prover:9.1.1@sha256:b85a80a11bb65c7c843f91c7cbcce282f22ee397c9ca42f123d568ab6cef68b0
      options: --user root
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Compile every proof and reject trust escapes
        run: >-
          opam exec --root=/home/rocq/.opam --switch="$COMPILER" --
          env LIBMORPHISM_FORMAL_SCOPED=1 scripts/verify-formal.sh rocq
